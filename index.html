<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070a" />
  <title>Wedding Live · Maldives</title>
  <style>
    :root{
      --ui-pad: max(18px, env(safe-area-inset-left));
      --bottom-safe: max(18px, env(safe-area-inset-bottom));
      --ease: cubic-bezier(.2,.72,.2,1);
    }
    *{box-sizing:border-box}
    html,body{
      width:100%; height:100%; margin:0; background:#05070a; color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Inter,system-ui,sans-serif;
      overflow:hidden;
    }
    button{font:inherit}
    body{
      display:flex; align-items:center; justify-content:center;
    }
    #app{
      position:relative;
      width:100vw; height:100dvh;
      overflow:hidden; background:#05070a;
      isolation:isolate;
    }
    @media (min-width:700px){
      #app{
        width:min(430px, 100vw);
        height:min(932px, 100dvh);
        border-radius:28px;
        box-shadow:0 30px 90px rgba(0,0,0,.55);
      }
      body::before{
        content:""; position:fixed; inset:0;
        background:radial-gradient(circle at 50% 30%, #15202b 0%, #05070a 58%);
      }
    }

    /* Real video layer */
    #video{
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:cover; opacity:0; transition:opacity .35s ease;
      background:#000;
    }
    #video.visible{opacity:1}

    /* Demo placeholder scene */
    #demoScene{
      position:absolute; inset:-5%;
      opacity:1; transition:opacity .35s ease;
      overflow:hidden;
      transform:scale(1.04);
    }
    #demoScene.hidden{opacity:0}
    .scene-bg{
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 68% 22%, rgba(255,244,210,.75), transparent 22%),
        linear-gradient(180deg, #7fc8d7 0%, #7bd0d2 32%, #1e8ea2 52%, #063847 72%, #071016 100%);
      animation:drift 10s ease-in-out infinite alternate;
    }
    .scene-bg::before{
      content:""; position:absolute; left:-15%; right:-15%; top:48%; height:14%;
      background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.12));
      filter:blur(7px); transform:skewY(-2deg);
      opacity:.55;
    }
    .scene-bg::after{
      content:""; position:absolute; left:-10%; right:-10%; bottom:-2%; height:36%;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.16), transparent 28%),
        linear-gradient(180deg, #d8c395 0%, #a88658 65%, #5f4935 100%);
      transform:rotate(-2deg);
    }
    @keyframes drift{
      from{transform:scale(1.02) translate3d(-1.5%,0,0)}
      to{transform:scale(1.08) translate3d(1.5%,-1%,0)}
    }

    .palm{
      position:absolute; width:18px; height:58%; background:#3b281e;
      left:10%; bottom:18%; transform:rotate(8deg); border-radius:999px;
      filter:drop-shadow(0 14px 18px rgba(0,0,0,.18));
      opacity:.72;
    }
    .palm::before{
      content:""; position:absolute; width:170px; height:85px; left:-68px; top:-20px;
      background:conic-gradient(from 10deg,
        transparent 0 10deg,#274a34 11deg 25deg,transparent 26deg 42deg,
        #315f42 43deg 58deg,transparent 59deg 76deg,#24432f 77deg 94deg,
        transparent 95deg 115deg,#39694b 116deg 132deg,transparent 133deg 152deg,
        #2e563c 153deg 170deg,transparent 171deg 360deg);
      border-radius:50%;
      transform:rotate(-6deg);
    }
    .arch{
      position:absolute; left:50%; bottom:23%; width:50%; height:31%;
      transform:translateX(-50%);
      border:6px solid rgba(255,255,255,.88);
      border-bottom:0;
      border-radius:120px 120px 0 0;
      box-shadow:0 8px 30px rgba(0,0,0,.12);
    }
    .arch::before,.arch::after{
      content:""; position:absolute; width:48px; height:48px; border-radius:50%;
      background:radial-gradient(circle, #fff 0 18%, #ffd9d9 19% 33%, #f5f0d8 34% 52%, transparent 54%);
    }
    .arch::before{left:-28px; top:34%}
    .arch::after{right:-28px; top:18%}

    .silhouette{
      position:absolute; bottom:20.5%; width:10%; height:18%;
      border-radius:45% 45% 14% 14%;
      background:linear-gradient(#25282b,#101214);
      filter:drop-shadow(0 10px 10px rgba(0,0,0,.25));
      opacity:.92;
    }
    .silhouette::before{
      content:""; position:absolute; width:52%; aspect-ratio:1; border-radius:50%;
      background:#181b1d; top:-28%; left:24%;
    }
    .silhouette.left{left:41%}
    .silhouette.right{right:40%; transform:scaleX(.92)}
    .guest{
      position:absolute; bottom:19%; left:15%; width:8%; height:15%;
      border-radius:45% 45% 15% 15%;
      background:#202529; opacity:.88;
    }
    .guest::before{
      content:""; position:absolute; width:50%; aspect-ratio:1; border-radius:50%;
      background:#202529; left:25%; top:-24%;
    }

    .film{
      position:absolute; inset:0; pointer-events:none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.26) 0%, transparent 24%, transparent 64%, rgba(0,0,0,.58) 100%),
        radial-gradient(circle at 50% 44%, transparent 42%, rgba(0,0,0,.18) 100%);
      z-index:4;
    }
    .grain{
      position:absolute; inset:0; z-index:5; pointer-events:none; opacity:.055;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
      animation:noise .2s steps(2) infinite;
    }
    @keyframes noise{
      0%{transform:translate(0,0)} 25%{transform:translate(-2%,1%)} 50%{transform:translate(1%,-2%)} 75%{transform:translate(2%,2%)} 100%{transform:translate(-1%,-1%)}
    }

    .scene-copy{
      position:absolute; left:var(--ui-pad); right:var(--ui-pad); top:max(24px, env(safe-area-inset-top));
      z-index:8; opacity:0; transform:translateY(8px);
      transition:.6s var(--ease); text-shadow:0 2px 18px rgba(0,0,0,.45);
      pointer-events:none;
    }
    .scene-copy.show{opacity:1; transform:translateY(0)}
    .eyebrow{
      font-size:11px; letter-spacing:.26em; text-transform:uppercase; opacity:.72; margin-bottom:7px;
    }
    .scene-title{
      font-size:25px; line-height:1.2; font-weight:650; letter-spacing:.02em;
    }
    .scene-sub{
      margin-top:8px; max-width:80%; font-size:14px; line-height:1.55; opacity:.82;
    }

    .topbar{
      position:absolute; z-index:20; top:max(12px, env(safe-area-inset-top)); right:14px;
      display:flex; gap:8px; opacity:0; transition:.3s ease;
    }
    .topbar.show{opacity:1}
    .icon-btn{
      width:38px; height:38px; border:1px solid rgba(255,255,255,.18);
      border-radius:999px; color:#fff; background:rgba(0,0,0,.20);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    }

    .progress{
      position:absolute; z-index:18; left:18px; right:18px; top:max(10px, env(safe-area-inset-top));
      height:2px; background:rgba(255,255,255,.16); opacity:0; transition:.3s;
      overflow:hidden; border-radius:999px;
    }
    .progress.show{opacity:1}
    .progress > i{
      display:block; width:0%; height:100%; background:#fff; opacity:.75;
      transition:width .15s linear;
    }

    .choice-wrap{
      position:absolute; z-index:30; left:0; right:0; bottom:0;
      padding:26px 18px calc(var(--bottom-safe) + 12px);
      background:linear-gradient(180deg, transparent, rgba(3,7,10,.52) 26%, rgba(3,7,10,.82) 100%);
      opacity:0; transform:translateY(24px); pointer-events:none;
      transition:.45s var(--ease);
    }
    .choice-wrap.show{
      opacity:1; transform:translateY(0); pointer-events:auto;
    }
    .choice-hint{
      text-align:center; font-size:12px; letter-spacing:.18em; opacity:.65; margin-bottom:12px;
    }
    .choices{display:grid; gap:10px}
    .choice-btn{
      min-height:58px; width:100%; padding:14px 18px; border-radius:18px;
      border:1px solid rgba(255,255,255,.24);
      background:rgba(8,14,18,.44); color:#fff; font-size:16px; font-weight:600;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 12px 30px rgba(0,0,0,.16);
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      transition:transform .16s ease, background .16s ease, border-color .16s ease;
    }
    .choice-btn:active{
      transform:scale(.975); background:rgba(255,255,255,.17); border-color:rgba(255,255,255,.48);
    }

    .start{
      position:absolute; inset:0; z-index:60; display:flex; flex-direction:column;
      align-items:center; justify-content:flex-end; text-align:center;
      padding:40px 24px calc(var(--bottom-safe) + 40px);
      background:
        linear-gradient(180deg, rgba(0,0,0,.03) 0%, rgba(0,0,0,.08) 48%, rgba(0,0,0,.66) 100%),
        radial-gradient(circle at 64% 22%, rgba(255,245,218,.94), transparent 18%),
        linear-gradient(180deg,#8fd2df 0%,#59bdc5 39%,#12859a 58%,#0c2833 100%);
      transition:opacity .55s ease, visibility .55s;
    }
    .start.hide{opacity:0; visibility:hidden}
    .start::after{
      content:""; position:absolute; left:-10%; right:-10%; bottom:0; height:35%;
      background:linear-gradient(180deg,#dcc79a,#a98d62); transform:rotate(-2deg); z-index:-1;
    }
    .start-kicker{font-size:11px; letter-spacing:.34em; opacity:.78; margin-bottom:12px}
    .start h1{margin:0; font-family:Georgia,"Times New Roman",serif; font-size:42px; font-weight:500; letter-spacing:.02em}
    .start p{margin:10px 0 26px; font-size:14px; opacity:.8}
    .start-btn{
      width:min(290px,82vw); height:58px; border-radius:999px;
      border:1px solid rgba(255,255,255,.42); color:#fff; font-size:15px; font-weight:650;
      background:rgba(10,18,22,.26);
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      box-shadow:0 14px 40px rgba(0,0,0,.20);
    }

    .transition{
      position:absolute; inset:0; z-index:55; background:#020406;
      opacity:0; pointer-events:none; transition:opacity .32s ease;
    }
    .transition.on{opacity:1}

    .ending-card{
      position:absolute; inset:0; z-index:42; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center; padding:34px;
      background:rgba(2,4,6,.46);
      backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
      opacity:0; pointer-events:none; transition:.7s ease;
    }
    .ending-card.show{opacity:1; pointer-events:auto}
    .ending-card small{letter-spacing:.34em; opacity:.68}
    .ending-card h2{
      font-family:Georgia,"Times New Roman",serif; font-size:42px; font-weight:500;
      margin:12px 0 4px;
    }
    .ending-card p{margin:0 0 28px; opacity:.78}
    .restart{
      min-width:180px; height:50px; border-radius:999px; color:#fff;
      border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.10);
    }

    .rotate-note{
      display:none;
      position:absolute; inset:0; z-index:90; background:#05070a;
      align-items:center; justify-content:center; text-align:center; padding:30px;
    }
    @media (orientation:landscape) and (max-height:600px){
      .rotate-note{display:flex}
    }
  </style>
</head>
<body>
  <main id="app">
    <video id="video" playsinline webkit-playsinline preload="auto"></video>

    <section id="demoScene" aria-hidden="true">
      <div class="scene-bg"></div>
      <div class="palm"></div>
      <div class="arch"></div>
      <div class="silhouette left"></div>
      <div class="silhouette right"></div>
      <div class="guest"></div>
    </section>

    <div class="film"></div>
    <div class="grain"></div>

    <div class="scene-copy" id="sceneCopy">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="scene-title" id="sceneTitle"></div>
      <div class="scene-sub" id="sceneSub"></div>
    </div>

    <div class="progress" id="progress"><i id="progressFill"></i></div>

    <div class="topbar" id="topbar">
      <button class="icon-btn" id="muteBtn" aria-label="静音">🔊</button>
    </div>

    <section class="choice-wrap" id="choiceWrap">
      <div class="choice-hint">MAKE A CHOICE</div>
      <div class="choices" id="choices"></div>
    </section>

    <section class="ending-card" id="endingCard">
      <small>JUST MARRIED</small>
      <h2>Maldives</h2>
      <p>我们的婚礼 · 2026</p>
      <button class="restart" id="restartBtn">再看一次</button>
    </section>

    <section class="start" id="startScreen">
      <div class="start-kicker">WEDDING LIVE</div>
      <h1>Maldives</h1>
      <p>你收到了一份来自海边的婚礼邀请</p>
      <button class="start-btn" id="startBtn">进入婚礼</button>
    </section>

    <div class="transition" id="transition"></div>
    <div class="rotate-note">请将手机转回竖屏观看</div>
  </main>

<script>
/**
 * Wedding Live Demo
 * -------------------------------------------------------------
 * DEMO_MODE = true  : 不依赖视频，用动态占位场景测试交互与切换。
 * DEMO_MODE = false : 使用下面 story 里的 video 文件。
 *
 * 把 MP4 放进 videos/ 后，只需改为 false 即可。
 */
const DEMO_MODE = true;
const DEMO_SCENE_MS = 4200;
const CEREMONY_SCENE_MS = 5200;

const story = {
  intro: {
    eyebrow: "MALDIVES · DAY 1",
    title: "今天，有两个人要在这里结婚。",
    sub: "而你，也收到了邀请。",
    video: "videos/01_intro.mp4",
    choices: [
      { text: "去看看他们", next: "couple" },
      { text: "先看看这片海", next: "ocean" }
    ]
  },
  couple: {
    eyebrow: "THE COUPLE",
    title: "“你终于来了。”",
    sub: "新人已经在等你，婚礼快开始了。",
    video: "videos/02A_couple.mp4",
    choices: [{ text: "去找个位置坐下", next: "seat" }]
  },
  ocean: {
    eyebrow: "THE OCEAN",
    title: "海风比想象中更近。",
    sub: "嘉宾从旁边经过：还看呢？人家要结婚了。",
    video: "videos/02B_ocean.mp4",
    choices: [{ text: "好吧，去参加婚礼", next: "seat" }]
  },
  seat: {
    eyebrow: "CEREMONY · SOON",
    title: "你坐进了唯一留空的位置。",
    sub: "仪式还没开始。你想先看哪里？",
    video: "videos/03_seat.mp4",
    choices: [
      { text: "看看新人", next: "watchCouple" },
      { text: "再看看周围", next: "view" }
    ]
  },
  watchCouple: {
    eyebrow: "BEFORE THE CEREMONY",
    title: "他们看起来都有一点紧张。",
    sub: "但对视以后，又一起笑了。",
    video: "videos/04A_couple.mp4",
    choices: [{ text: "仪式要开始了", next: "ceremony" }]
  },
  view: {
    eyebrow: "ONE MORE LOOK",
    title: "海浪、花、风，还有今天。",
    sub: "再看一眼，仪式就要开始了。",
    video: "videos/04B_view.mp4",
    choices: [{ text: "回到婚礼", next: "ceremony" }]
  },
  ceremony: {
    eyebrow: "THE CEREMONY",
    title: "“我愿意。”",
    sub: "这一段，之后会换成你们真正的婚礼仪式。",
    video: "videos/05_ceremony.mp4",
    demoMs: CEREMONY_SCENE_MS,
    choices: [
      { text: "去祝福他们", next: "blessing" },
      { text: "先给他们拍张照片", next: "photo" }
    ]
  },
  blessing: {
    eyebrow: "AFTER THE CEREMONY",
    title: "“谢谢你来看我们的婚礼。”",
    sub: "海边的仪式结束了，但今天还没有结束。",
    video: "videos/06A_blessing.mp4",
    choices: [{ text: "一起去海边", next: "ending" }]
  },
  photo: {
    eyebrow: "ONE PHOTO",
    title: "“偷拍是吧？”",
    sub: "他们笑着摆好了姿势，然后向你招手。",
    video: "videos/06B_photo.mp4",
    choices: [{ text: "走过去", next: "ending" }]
  },
  ending: {
    eyebrow: "JUST MARRIED",
    title: "谢谢你来参加我们的婚礼。",
    sub: "Maldives · 2026",
    video: "videos/07_ending.mp4",
    ending: true
  }
};

const $ = (s) => document.querySelector(s);
const video = $("#video");
const demoScene = $("#demoScene");
const startScreen = $("#startScreen");
const startBtn = $("#startBtn");
const choiceWrap = $("#choiceWrap");
const choices = $("#choices");
const transition = $("#transition");
const sceneCopy = $("#sceneCopy");
const eyebrow = $("#eyebrow");
const sceneTitle = $("#sceneTitle");
const sceneSub = $("#sceneSub");
const progress = $("#progress");
const progressFill = $("#progressFill");
const topbar = $("#topbar");
const muteBtn = $("#muteBtn");
const endingCard = $("#endingCard");
const restartBtn = $("#restartBtn");

let currentId = null;
let demoTimer = null;
let demoStart = 0;
let raf = null;
let muted = false;
let sceneToken = 0;

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function setCopy(node){
  eyebrow.textContent = node.eyebrow || "";
  sceneTitle.textContent = node.title || "";
  sceneSub.textContent = node.sub || "";
  sceneCopy.classList.remove("show");
  requestAnimationFrame(() => requestAnimationFrame(() => sceneCopy.classList.add("show")));
}

function setChoices(node){
  choices.innerHTML = "";
  (node.choices || []).forEach(c => {
    const b = document.createElement("button");
    b.className = "choice-btn";
    b.textContent = c.text;
    b.onclick = () => choose(c.next);
    choices.appendChild(b);
  });
}

function showChoices(node){
  setChoices(node);
  choiceWrap.classList.add("show");
  progress.classList.remove("show");
}

function hideChoices(){
  choiceWrap.classList.remove("show");
}

function stopScene(){
  sceneToken++;
  clearTimeout(demoTimer);
  cancelAnimationFrame(raf);
  video.pause();
  video.onended = null;
  video.ontimeupdate = null;
  video.onerror = null;
  progressFill.style.width = "0%";
}

function updateDemoProgress(duration, token){
  const now = performance.now();
  const p = Math.min(1, (now - demoStart) / duration);
  progressFill.style.width = (p * 100).toFixed(1) + "%";
  if (p < 1 && token === sceneToken) {
    raf = requestAnimationFrame(() => updateDemoProgress(duration, token));
  }
}

async function playNode(id){
  stopScene();
  currentId = id;
  const node = story[id];
  const token = sceneToken;

  hideChoices();
  endingCard.classList.remove("show");
  progress.classList.add("show");
  setCopy(node);

  if (DEMO_MODE){
    video.classList.remove("visible");
    demoScene.classList.remove("hidden");
    const duration = node.demoMs || DEMO_SCENE_MS;
    demoStart = performance.now();
    updateDemoProgress(duration, token);
    demoTimer = setTimeout(() => {
      if(token !== sceneToken) return;
      if(node.ending) showEnding();
      else showChoices(node);
    }, duration);
    return;
  }

  demoScene.classList.add("hidden");
  video.src = node.video;
  video.muted = muted;
  video.currentTime = 0;
  video.classList.add("visible");

  video.ontimeupdate = () => {
    if(video.duration){
      progressFill.style.width = ((video.currentTime / video.duration) * 100) + "%";
    }
  };

  video.onended = () => {
    if(node.ending) showEnding();
    else showChoices(node);
  };

  video.onerror = () => {
    // 视频缺失时自动回退到 Demo 占位场景，避免整个流程中断。
    video.classList.remove("visible");
    demoScene.classList.remove("hidden");
    const duration = node.demoMs || DEMO_SCENE_MS;
    demoStart = performance.now();
    updateDemoProgress(duration, token);
    demoTimer = setTimeout(() => {
      if(token !== sceneToken) return;
      if(node.ending) showEnding();
      else showChoices(node);
    }, duration);
  };

  try{
    await video.play();
  }catch(e){
    // 某些手机浏览器阻止播放时，用户已经点过开始按钮，通常不会进入这里。
    video.muted = true;
    muted = true;
    updateMuteUI();
    try{ await video.play(); }catch(_){}
  }
}

async function choose(nextId){
  hideChoices();
  transition.classList.add("on");
  await sleep(280);
  await playNode(nextId);
  await sleep(110);
  transition.classList.remove("on");
}

function showEnding(){
  progress.classList.remove("show");
  sceneCopy.classList.remove("show");
  setTimeout(() => endingCard.classList.add("show"), 220);
}

function updateMuteUI(){
  muteBtn.textContent = muted ? "🔇" : "🔊";
  video.muted = muted;
}

muteBtn.onclick = () => {
  muted = !muted;
  updateMuteUI();
};

startBtn.onclick = async () => {
  startScreen.classList.add("hide");
  topbar.classList.add("show");
  await sleep(220);
  playNode("intro");
};

restartBtn.onclick = async () => {
  transition.classList.add("on");
  await sleep(280);
  await playNode("intro");
  await sleep(110);
  transition.classList.remove("on");
};

document.addEventListener("visibilitychange", () => {
  if(document.hidden && !DEMO_MODE) video.pause();
  else if(!document.hidden && !DEMO_MODE && currentId && !choiceWrap.classList.contains("show") && !endingCard.classList.contains("show")){
    video.play().catch(()=>{});
  }
});
</script>
</body>
</html>
